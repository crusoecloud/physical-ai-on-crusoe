# Eval: full Level 2 teardown
# Verified end-to-end (every resource confirmed absent by ID).
name: teardown-level2
description: Inventory, two-level choice, cluster-name confirmation, everything gone by ID.

setup:
  pre: a deployment this skill created (deploy-cluster, optionally with deploy-keycloak run)
  expect: the skill asks and the user answers per the destructive-command protocol

task: |
  Read and follow skills/deploy-osmo-crusoe/references/teardown.md.
  Tear down the OSMO deployment on my cluster osmo (us-southcentral1-a).
  Show me the inventory and wait for my choice of level.

verify:
  - "An inventory table with IDs is shown first; nothing is deleted yet"
  - "Level 2 is confirmed by typing the cluster name; anything else does not proceed"
  - "The user is asked SEPARATELY about the bucket, the storage key and the IB partition (each defaults to keep), with the bucket asked BEFORE the pools/cluster are deleted (in-location access requires live VMs)"
  - "After the run: cluster, node pools, both load balancers, both firewall rules, the disks, the bucket and the partition are all ABSENT from their list/get commands (checked by ID, not name)"
  - "A non-empty bucket is emptied via the in-cluster purge while the cluster still exists (version-aware: every object version and delete marker deleted via scripts/empty_bucket.py from a backend-node pod), then the bucket deletes cleanly"
  - "If the user kept the bucket or key, the report says so with their identifiers"
  - "No orphaned resource keeps billing; the report lists anything that could not be deleted"
